<!DOCTYPE html>
<!-- `booting` suppresses the entrance animations of whatever the app lands on. They are
     polish for opening a page mid-session; during boot they mean the window is revealed
     partway through a fade-and-scale, so the screen finishes appearing after the window
     is already visible. Removed by useShellReady. -->
<html lang="en" class="booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: app-sprite:; font-src 'self' data:; connect-src 'self' ws: wss:"
    />
    <title>Relic of the Past</title>
    <!-- Boot splash: painted instantly (no bundle/JS/WASM needed). React replaces
         #root on first render, so the splash tears itself down for free.
         Desktop no longer relies on this. It has its own splash WINDOW (splash.html)
         and keeps this one invisible until the shell settles. It stays for web and
         Android, where nothing else covers the gap before React mounts. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #000;
      }
      #boot-splash img {
        width: 192px;
        height: 192px;
        image-rendering: auto;
      }
      #boot-splash .boot-splash__spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #c8a84e;
        animation: boot-splash-rotate 0.7s linear infinite;
      }
      @keyframes boot-splash-rotate {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <img src="./logos/logo-256.png" alt="" />
        <div class="boot-splash__spinner"></div>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
