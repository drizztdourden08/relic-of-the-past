# TEMPORARY. Proves the release build actually carries the private dataset, without
# cutting a release. Delete this file once the result is accepted.
#
# Two jobs on purpose:
#   with-vault     the real release path — fetch, preflight, build, assert data PRESENT
#   without-vault  the same build with no fetch      — assert data ABSENT
#
# The second is the control. Without it "present" proves nothing: if the grep were
# wrong it would pass in both directions and we would learn nothing about the fix.
name: Vault smoke (temporary)

on:
  push:
    branches: [fix/ship-vault-dataset]
  workflow_dispatch:

jobs:
  with-vault:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Confirm the dataset is absent before the fetch
        shell: bash
        run: |
          if [ -d shared/game/data/records ]; then
            echo "::error::records/ exists before the fetch — the checkout is not clean"; exit 1
          fi
          echo "records/ absent, as a plain checkout should be"

      - name: Fetch the private dataset
        shell: bash
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          if [ -z "$VAULT_TOKEN" ]; then echo "::error::VAULT_TOKEN is not set"; exit 1; fi
          git clone --depth 1 \
            "https://x-access-token:${VAULT_TOKEN}@github.com/drizztdourden08/rotp-vault.git" \
            ../rotp-vault
          node scripts/vault/sync.mjs --force-pull

      - name: Verify the dataset landed
        shell: bash
        run: node scripts/vault/check-dataset.mjs

      - name: Confirm the vault clone was not written to
        shell: bash
        # --force-pull is meant to be one-directional here. If it committed to the
        # vault, the CI clone would be ahead of its origin and the mode is unsafe.
        run: |
          cd ../rotp-vault
          if [ -n "$(git log origin/HEAD..HEAD --oneline 2>/dev/null)" ]; then
            echo "::error::the sync committed to the vault clone"; git log --oneline -3; exit 1
          fi
          echo "vault clone untouched"

      - name: Build
        shell: bash
        run: npx electron-vite build

      - name: Assert the bundle carries the dataset
        shell: bash
        run: |
          set -e
          fail=0
          for marker in '"label":"Fighter Sword"' '"method":"hud-tiles"' 'LW_CAVES_SCREENS'; do
            # No pipeline: under `-o pipefail` a no-match grep would kill the step
            # before it could report, which is a pass looking like a failure.
            if grep -rlF "$marker" dist/ > /tmp/hits 2>/dev/null; then n=$(wc -l < /tmp/hits); else n=0; fi
            echo "$marker -> $n file(s)"
            [ "$n" -gt 0 ] || { echo "::error::missing from the bundle: $marker"; fail=1; }
          done
          exit $fail

  without-vault:
    # The control. Same build, no fetch. Must produce a bundle WITHOUT the data,
    # which is exactly what v0.17.0 through v0.18.0 shipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: The preflight must REFUSE this build
        shell: bash
        run: |
          if node scripts/vault/check-dataset.mjs; then
            echo "::error::preflight passed with no dataset — it would not have caught the regression"
            exit 1
          fi
          echo "preflight correctly refused"

      - name: Build
        shell: bash
        run: npx electron-vite build

      - name: Assert the bundle is hollow, reproducing the shipped bug
        shell: bash
        run: |
          set -e
          fail=0
          for marker in '"label":"Fighter Sword"' '"method":"hud-tiles"' 'LW_CAVES_SCREENS'; do
            # No pipeline: under `-o pipefail` a no-match grep would kill the step
            # before it could report, which is a pass looking like a failure.
            if grep -rlF "$marker" dist/ > /tmp/hits 2>/dev/null; then n=$(wc -l < /tmp/hits); else n=0; fi
            echo "$marker -> $n file(s)"
            [ "$n" -eq 0 ] || { echo "::error::unexpectedly present without the vault: $marker"; fail=1; }
          done
          exit $fail
