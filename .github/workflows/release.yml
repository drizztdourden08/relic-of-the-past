name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate (lint, typecheck, analyze, WASM export-drift)
        run: npm run ci

      - name: Check required files exist
        run: |
          echo "Checking critical files..."
          test -f package.json || { echo "Missing package.json"; exit 1; }
          test -f package-lock.json || { echo "Missing package-lock.json"; exit 1; }
          test -f scripts/build/electron-builder.config.js || { echo "Missing electron-builder config"; exit 1; }
          test -f electron.vite.config.ts || { echo "Missing electron.vite.config.ts"; exit 1; }
          test -d core/wasm-build || { echo "Missing core/wasm-build"; exit 1; }
          test -f core/wasm-build/Makefile || { echo "Missing WASM Makefile"; exit 1; }
          echo "All preflight checks passed."

  build:
    needs: preflight
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            args: --win
          - os: macos-latest
            platform: mac
            args: --mac
          - os: ubuntu-latest
            platform: linux
            args: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 3.1.51

      - name: Build WASM
        run: |
          cd core/wasm-build
          emmake make
          mkdir -p ../../apps/desktop/public/wasm
          cp output/zelda3.js ../../apps/desktop/public/wasm/
          cp output/zelda3.wasm ../../apps/desktop/public/wasm/
        shell: bash

      - name: Install dependencies
        run: npm ci

      - name: Build & Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-vite build
          npx electron-builder ${{ matrix.args }} --publish never --config scripts/build/electron-builder.config.js -c.directories.output=release/${{ matrix.platform }}

      - name: Clean build artifacts
        shell: bash
        run: |
          rm -rf release/${{ matrix.platform }}/*-unpacked
          rm -rf release/${{ matrix.platform }}/.icon-ico
          rm -f release/${{ matrix.platform }}/builder-debug.yml
          rm -f release/${{ matrix.platform }}/builder-effective-config.yaml

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release/${{ matrix.platform }}/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Generate release body
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          BASE="https://github.com/drizztdourden08/relic-of-the-past/releases/download/${TAG}"
          {
            echo "## Downloads"
            echo ""
            echo "**Windows**"
            echo "- [Portable (.exe)](${BASE}/rotp-windows-portable.exe) — no installation needed"
            echo "- [Installer (.exe)](${BASE}/rotp-windows-setup.exe)"
            echo ""
            echo "**macOS**"
            echo "- [Disk Image (.dmg)](${BASE}/rotp-macos.dmg)"
            echo ""
            echo "**Linux**"
            echo "- [AppImage](${BASE}/rotp-linux.AppImage) — universal"
            echo "- [Debian Package (.deb)](${BASE}/rotp-linux.deb)"
          } > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: false
          body_path: release-body.md
          files: |
            artifacts/release-win/*
            artifacts/release-mac/*
            artifacts/release-linux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
