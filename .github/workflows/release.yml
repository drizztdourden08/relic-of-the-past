name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            args: --win
          - os: macos-latest
            platform: mac
            args: --mac
          - os: ubuntu-latest
            platform: linux
            args: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 3.1.51

      - name: Build WASM
        run: |
          cd core/wasm-build
          emmake make
          mkdir -p ../../apps/desktop/public/wasm
          cp output/zelda3.js ../../apps/desktop/public/wasm/
          cp output/zelda3.wasm ../../apps/desktop/public/wasm/
          cp output/zelda3.data ../../apps/desktop/public/wasm/ 2>/dev/null || true
        shell: bash

      - name: Install dependencies
        run: npm ci

      - name: Build & Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-vite build
          npx electron-builder ${{ matrix.args }} --publish never --config electron-builder.config.js -c.directories.output=release/${{ matrix.platform }}

      - name: Clean build artifacts
        shell: bash
        run: |
          rm -rf release/${{ matrix.platform }}/*-unpacked
          rm -rf release/${{ matrix.platform }}/.icon-ico
          rm -f release/${{ matrix.platform }}/builder-debug.yml
          rm -f release/${{ matrix.platform }}/builder-effective-config.yaml

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release/${{ matrix.platform }}/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: false
          files: |
            artifacts/release-win/*
            artifacts/release-mac/*
            artifacts/release-linux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
