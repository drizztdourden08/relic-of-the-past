# Mirrors the in-repo docs/ folder (the source of truth) to the GitHub Wiki.
# Runs on pushes to master that touch docs/**. The repo's docs/Home.md is the
# wiki landing page and docs/_Sidebar.md is the wiki navigation menu.
#
# One-time prerequisite: enable the Wiki in repo Settings and create one page so
# the <repo>.wiki.git repository exists before the first sync.
name: Sync docs → Wiki

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-wiki-sync.yml'
  workflow_dispatch: {}

permissions:
  contents: write

# Avoid concurrent pushes to the wiki repo clobbering each other.
concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    # Only sync once the repo is public (wiki is unavailable on private repos
    # without an org plan). Safe no-op while the project is still private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # GitHub wikis only render pages at the repo ROOT, and pages in subdirectories
      # redirect to their raw blob and 404. docs/ is organised into folders, so
      # flatten it to root-level slugs and rewrite intra-doc links before
      # publishing. Source docs/ is untouched; the flat copy is .wiki-build/.
      - name: Build flat wiki pages from docs/
        run: node scripts/build-wiki.mjs
      - name: Publish to the wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: .wiki-build
          strategy: clone
          # We pre-flatten and rewrite links ourselves; keep the action's own
          # preprocessing off so it doesn't move README.md over our Home.md.
          preprocess: false
          commit-message: 'docs: sync wiki from docs/ @ ${{ github.sha }}'
