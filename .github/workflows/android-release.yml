name: Android APK (manual)

# Ad-hoc, on-demand signed APK build that uploads the APK as a workflow artifact.
# The release path (build-android in release.yml) already ships the APK; this
# workflow only builds a one-off APK outside a release (e.g. to test a branch). Signing uses a
# self-signed keystore stored in repo secrets; see docs/contributing/testing-linux-and-android.md.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_B64       base64 of the release keystore (relic-release.jks)
#   ANDROID_KEYSTORE_PASSWORD  store/key password
#   ANDROID_KEY_ALIAS          key alias (e.g. "relic")

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # No version input: the action reads packageManager from package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy "tools" package from the SDK repository, and the
          # action asks for it by default. The Gradle build fetches what it needs.
          packages: platform-tools

      - name: Set up Emscripten (for the WASM core)
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 3.1.51

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM core
        # emcc is on PATH here (setup-emsdk), so the shared build script runs directly
        # and writes into apps/desktop/public/wasm, which the web build copies into the APK.
        run: node core/wasm-build/build.mjs

      # The record dataset is vault-only, so a plain checkout builds an APK with an
      # empty dataset. Runs after pnpm install so the two-way postinstall sync has
      # already skipped and cannot write back. See release.yml for the full note.
      - name: Fetch the private dataset
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${VAULT_TOKEN}@github.com/drizztdourden08/rotp-vault.git" \
            ../rotp-vault
          node scripts/vault/sync.mjs --force-pull

      - name: Verify the dataset landed
        run: node scripts/vault/check-dataset.mjs

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/relic-release.jks"

      # Web build, Capacitor sync into apps/desktop/mobile/android, then the signed Gradle build.
      - name: Build signed release APK
        env:
          BROCK_KEYSTORE_FILE: ${{ runner.temp }}/relic-release.jks
          BROCK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BROCK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x apps/desktop/mobile/android/gradlew
          pnpm --dir apps/desktop exec brock mobile build --release --out "$GITHUB_WORKSPACE/rotp-android.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: rotp-android-apk
          path: rotp-android.apk
