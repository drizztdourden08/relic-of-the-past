name: CI

# Runs on demand (manual "Run workflow") and on contributor PRs only.
# Direct pushes to master do NOT auto-run — release/verify by asking explicitly.
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, analyze, and WASM export-drift check
        run: npm run ci
