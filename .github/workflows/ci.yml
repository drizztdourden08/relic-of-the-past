name: CI

# Runs on demand (manual "Run workflow") and on contributor PRs only.
# Direct pushes to master do NOT auto-run. Ask for a release or a verify run.
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # No version input: the action reads packageManager from package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, analyze, and WASM export-drift check
        run: pnpm run ci
