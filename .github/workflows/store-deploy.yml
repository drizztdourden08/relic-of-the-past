name: Store deploy
run-name: Store deploy ${{ github.ref_name }}

# Deploys the store: the API first, then the site that fronts it. Runs on a
# `store-v*` tag push or on demand from the GitHub UI (Run workflow).
#
# Authentication is Workload Identity Federation, the same setup the Sanctuary
# deploy uses, so no cloud key is stored here. Two repository secrets carry it:
#   GCP_WORKLOAD_IDENTITY_PROVIDER  the provider resource name
#   GCP_SERVICE_ACCOUNT             the service account the workflow impersonates
#
# Plain settings come from repository variables (Settings > Variables):
#   the store's own: STORE_ORIGIN, B2_STORE_BUCKET, B2_STORE_KEY_ID,
#     STORE_GITHUB_CLIENT_ID (a second GitHub OAuth app, whose one callback
#     URL points at the store)
#   the shared account ones: DISCORD_CLIENT_ID, DISCORD_GUILD_ID,
#     DISCORD_CONTRIBUTOR_ROLE_ID, GOOGLE_CLIENT_ID,
#     SANCTUARY_ADMIN_IDS, B2_ENDPOINT, B2_REGION,
#     SCHEDULER_SA (the one account the daily job route accepts a scheduler token from)
# The repository comes from the run itself: GitHub refuses a GITHUB_REPO variable.
# Secret values never pass through here: the function reads them from Secret
# Manager at run time, by the names listed in the deploy step below.
on:
  push:
    tags:
      - 'store-v*'
  workflow_dispatch:

concurrency:
  group: store-deploy
  cancel-in-progress: false

permissions:
  contents: read
  # Needed to mint the OIDC token the federation exchanges for cloud credentials.
  id-token: write

env:
  GCP_PROJECT: relic-of-the-past
  GCP_REGION: us-central1

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # No version input: the action reads packageManager from package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # The function bundles the workspace packages it imports (@rotp/hub-contracts, the
      # @rotp/hub-server kit and the packages they read), and esbuild resolves their npm
      # dependencies from each package's own node_modules. One workspace install gives all of them.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the function
        working-directory: apps/store-api
        run: |
          pnpm run bundle
          test -f dist/index.js || { echo "::error::dist/index.js missing after build"; exit 1; }

      # The cloud build installs the runtime dependencies with npm, which cannot read
      # catalog: versions. pnpm pack writes the manifest with the catalog ranges filled in,
      # and the workspace packages leave it: they are already inside dist/index.js and no
      # registry holds them.
      - name: Resolve the function manifest for the cloud build
        working-directory: apps/store-api
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/rotp-store-api-*.tgz -C "$RUNNER_TEMP" package/package.json
          node -e "const fs = require('fs'); const m = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); for (const k of ['dependencies', 'devDependencies']) for (const d of Object.keys(m[k] ?? {})) if (d.startsWith('@rotp/')) delete m[k][d]; fs.writeFileSync('package.json', JSON.stringify(m, null, 2));" "$RUNNER_TEMP/package/package.json"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Completing a version hashes the whole upload, up to a 2 GB music pack,
      # so the function gets more time and memory than the Sanctuary's.
      # The ^;^ prefix makes ; the separator between variables, since SANCTUARY_ADMIN_IDS holds commas.
      - name: Deploy the function
        run: |
          gcloud functions deploy store-api \
            --gen2 \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --runtime=nodejs24 \
            --entry-point=storeApi \
            --source=apps/store-api \
            --trigger-http \
            --allow-unauthenticated \
            --timeout=300s \
            --memory=512Mi \
            --set-env-vars="^;^STORE_ORIGIN=${{ vars.STORE_ORIGIN }};B2_STORE_BUCKET=${{ vars.B2_STORE_BUCKET }};B2_STORE_KEY_ID=${{ vars.B2_STORE_KEY_ID }};B2_ENDPOINT=${{ vars.B2_ENDPOINT }};B2_REGION=${{ vars.B2_REGION }};DISCORD_CLIENT_ID=${{ vars.DISCORD_CLIENT_ID }};DISCORD_GUILD_ID=${{ vars.DISCORD_GUILD_ID }};DISCORD_CONTRIBUTOR_ROLE_ID=${{ vars.DISCORD_CONTRIBUTOR_ROLE_ID }};GITHUB_CLIENT_ID=${{ vars.STORE_GITHUB_CLIENT_ID }};GITHUB_REPO=${{ github.repository }};GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }};SANCTUARY_ADMIN_IDS=${{ vars.SANCTUARY_ADMIN_IDS }};SCHEDULER_SA=${{ vars.SCHEDULER_SA }}" \
            --set-secrets="SANCTUARY_SESSION_KEY=SANCTUARY_SESSION_KEY:latest,DISCORD_CLIENT_SECRET=DISCORD_CLIENT_SECRET:latest,GITHUB_CLIENT_SECRET=STORE_GITHUB_CLIENT_SECRET:latest,GITHUB_READ_TOKEN=GITHUB_READ_TOKEN:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,DISCORD_BOT_TOKEN=DISCORD_BOT_TOKEN:latest,B2_STORE_APP_KEY=b2-store-app-key:latest"

  site:
    # The site rewrites /api/** to the function, so it goes out second.
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # No version input: the action reads packageManager from package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the site
        run: pnpm --filter @rotp/store build

      # The auth action exports GOOGLE_APPLICATION_CREDENTIALS, which firebase-tools
      # picks up on its own, so no login step follows.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # The root firebase.json names the store as a hosting target.
      - name: Deploy hosting
        run: pnpm dlx firebase-tools deploy --only hosting:store --project "$GCP_PROJECT" --non-interactive
